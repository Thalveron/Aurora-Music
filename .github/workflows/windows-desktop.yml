name: Windows desktop build

on:
  workflow_dispatch:
    inputs:
      upload_installer:
        description: 'Attach a downloadable installer after validation'
        type: boolean
        default: false
  push:
    paths:
      - 'desktop/jvm/**'
      - 'app/src/main/java/com/craftworks/music/data/model/**'
      - 'app/src/main/java/com/craftworks/music/providers/navidrome/**'
      - '.github/workflows/windows-desktop.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Locate WiX 3
        shell: pwsh
        run: |
          $wixBin = if ($env:WIX) { Join-Path $env:WIX 'bin' } else { '' }
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue) -and
              (-not $wixBin -or -not (Test-Path (Join-Path $wixBin 'candle.exe')))) {
            choco install wixtoolset --version=3.14.1.20250415 --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }
            $wixBin = Join-Path ${env:ProgramFiles(x86)} 'WiX Toolset v3.14\bin'
          }
          if ($wixBin -and (Test-Path (Join-Path $wixBin 'candle.exe'))) {
            $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Test and build installer
        shell: pwsh
        run: .\gradlew.bat -p desktop/jvm test createDistributable packageExe --no-daemon
      - name: Smoke test packaged launcher
        shell: pwsh
        run: |
          $launcher = 'desktop/jvm/build/compose/binaries/main/app/Aurora Music/Aurora Music.exe'
          if (-not (Test-Path $launcher)) { throw 'Packaged launcher not found' }
          $decoder = Join-Path (Split-Path $launcher) 'app/resources/decoder/ffmpeg.exe'
          if (-not (Test-Path $decoder)) { throw 'Bundled offline decoder not found' }
          & $decoder -version
          if ($LASTEXITCODE -ne 0) { throw 'Bundled offline decoder failed to start' }
          $process = Start-Process -FilePath $launcher -PassThru
          try {
            Start-Sleep -Seconds 15
            $process.Refresh()
            if ($process.HasExited) { throw "Packaged launcher exited with code $($process.ExitCode)" }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Upload build for testing
        if: github.event_name == 'workflow_dispatch' && inputs.upload_installer
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-Music-windows-test-build
          path: desktop/jvm/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error
          retention-days: 7
