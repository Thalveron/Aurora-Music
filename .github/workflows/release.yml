name: Release Android

# Run manually from main. Signs with the key kept in repository secrets, adds the APK to the
# release for the current version and then advances updates/latest.json.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-android
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Load signing key
        env:
          AURORA_KEYSTORE_BASE64: ${{ secrets.AURORA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$AURORA_KEYSTORE_BASE64" ]; then
            echo "::error::Secret AURORA_KEYSTORE_BASE64 is not set. See MUSIC-UPDATES.md."
            exit 1
          fi
          printf '%s' "$AURORA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/aurora-release.jks"
          echo "AURORA_KEYSTORE_FILE=$RUNNER_TEMP/aurora-release.jks" >> "$GITHUB_ENV"
      - name: Test and build signed APK
        env:
          AURORA_KEYSTORE_PASSWORD: ${{ secrets.AURORA_KEYSTORE_PASSWORD }}
          AURORA_KEY_ALIAS: ${{ secrets.AURORA_KEY_ALIAS }}
          AURORA_KEY_PASSWORD: ${{ secrets.AURORA_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 tools/publish_release.py \
            --apk app/build/outputs/apk/release/app-release.apk \
            --notes "RELEASE_NOTES_v$version.md"
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/aurora-release.jks"
